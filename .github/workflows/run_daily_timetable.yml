name: Generate Daily GWR Timetable

on:
  schedule:
    # Wakes up automatically every single morning at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Keeps a manual trigger button active on your GitHub Dashboard

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Network Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Core Timetable Engine
      run: |
        python cron_job.py

    - name: Commit and Push Updated Timetable JSON
      run: |
        git config --global user.name "GWR Timetable Bot"
        git config --global user.email "actions@github.com"
        
        # Check if the files were safely created before running Git integration commands
        if [ -f gwr_timetable_today.json ]; then
          git add gwr_timetable_today.json gwr_timetable_today.csv
          git diff-index --quiet HEAD || git commit -m "Automated Daily Timetable Update: $(date +'%Y-%m-%d')"
          git push
        else
          echo "⚠️ No active GWR schedule records generated for today. Skipping commit."
        fi